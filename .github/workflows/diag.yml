# Diagnóstico da intermitência no Windows (não vai para a main): mede quem roda junto.
name: diag-concorrencia
on:
  push:
    branches: ['diag/**']
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, conc: 3, aquecer: 'sim', rep: 1 }
          - { os: windows-latest, conc: 3, aquecer: 'sim', rep: 2 }
          - { os: windows-latest, conc: 3, aquecer: 'sim', rep: 3 }
          - { os: windows-latest, conc: 3, aquecer: 'nao', rep: 1 }
          - { os: windows-latest, conc: 3, aquecer: 'nao', rep: 2 }
          - { os: windows-latest, conc: 2, aquecer: 'sim', rep: 1 }
          - { os: windows-latest, conc: 2, aquecer: 'sim', rep: 2 }
          - { os: windows-latest, conc: 2, aquecer: 'sim', rep: 3 }
          - { os: ubuntu-latest, conc: 3, aquecer: 'sim', rep: 1 }
    name: diag ${{ matrix.os }} c${{ matrix.conc }} a${{ matrix.aquecer }} r${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Primeiras aberturas do Chrome
        if: matrix.aquecer == 'sim'
        shell: bash
        run: node .github/diag/aquecer.mjs
      - name: Testes (com amostrador e registro por arquivo)
        shell: bash
        run: |
          node .github/diag/amostra.mjs "$RUNNER_TEMP/amostras.jsonl" "$RUNNER_TEMP/parar" &
          export NODE_OPTIONS="--import=$(node -p "require('url').pathToFileURL(require('path').resolve('.github/diag/tempo.mjs')).href")"
          set +e
          node --test --test-concurrency=${{ matrix.conc }} "kit/testes/*.test.mjs"
          saida=$?
          touch "$RUNNER_TEMP/parar"
          wait
          exit $saida
        env:
          ESTUDIO_TESTES_EXIGEM_NAVEGADOR: '1'
          DIAG_LINHA: ${{ runner.temp }}/linha.jsonl
      - name: Guardar medidas
        if: always()
        shell: bash
        run: |
          mkdir -p medidas
          cp "$RUNNER_TEMP/linha.jsonl" "$RUNNER_TEMP/amostras.jsonl" medidas/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medidas-${{ matrix.os }}-c${{ matrix.conc }}-a${{ matrix.aquecer }}-r${{ matrix.rep }}
          path: medidas/

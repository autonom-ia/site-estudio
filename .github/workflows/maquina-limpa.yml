# Instala o estudio do zero numa maquina limpa (Mac e Windows) seguindo a jornada de quem usa:
# o zip cai em Downloads (como faria o assistente ao baixar o link), o instalador poe a pasta no
# lugar de sempre, instala tudo, confere, faz um site de exemplo de ponta a ponta e
# simula a pessoa colando o link de novo com o estudio ja instalado.
# Adaptado do teste de maquina limpa do Estudio de Reels (MIT, Autonom.ia).
# Roda quando alguem empurra para uma branch ci/** ou release/**, ou pelo botao "Run workflow".
name: maquina-limpa

on:
  push:
    branches: ['ci/**', 'release/**']
  workflow_dispatch:

concurrency:
  group: maquina-limpa-${{ github.ref }}
  cancel-in-progress: true

env:
  LINK_DO_ESTUDIO: https://github.com/autonom-ia/site-estudio/releases/latest/download/site-estudio.zip

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Jornada de quem usa (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $falhas = @()
          $Z = Join-Path $env:RUNNER_TEMP 'site-estudio.zip'
          # O zip do release tem uma pasta so, chamada site-estudio; este e igual, feito deste commit.
          git archive --format=zip --prefix=site-estudio/ -o $Z HEAD
          $codigo = curl.exe -sIL -o NUL -w "%{http_code}" $env:LINK_DO_ESTUDIO
          Write-Output "link publico responde => $codigo (informativo: so existe depois do primeiro release)"

          # 1. O assistente baixa e descompacta em Downloads, fora do lugar de sempre.
          $dl = Join-Path $env:USERPROFILE 'Downloads'
          New-Item -ItemType Directory -Force $dl | Out-Null
          tar.exe -xf $Z -C $dl
          Set-Location (Join-Path $dl 'site-estudio')
          $r = powershell.exe -NoProfile -ExecutionPolicy Bypass -File instalar/instalar.ps1 mudar-pasta --agente codex | Select-Object -Last 1
          Write-Output "mudar-pasta (de Downloads) => $r"
          if ($r -notlike '*"codigo":"INSTALADO"*') { $falhas += 'mudar-pasta' }
          $casa = Join-Path $env:USERPROFILE 'site-estudio'
          if (-not (Test-Path (Join-Path $casa 'AGENTS.md'))) { $falhas += 'pasta-no-lugar' }

          # 2. Instala tudo a partir do lugar de sempre.
          Set-Location $casa
          $inst = 'instalar/instalar.ps1'
          $r = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $inst checar --agente codex | Select-Object -Last 1
          Write-Output "checar => $r"
          foreach ($p in @('pasta', 'node', 'pacotes', 'navegador')) {
            $ultima = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $inst passo $p --agente codex --modo tudo | Select-Object -Last 1
            Write-Output "passo $p => $ultima"
            if ($ultima -notlike '*"ok":true*') { $falhas += $p }
          }
          $v = powershell.exe -NoProfile -ExecutionPolicy Bypass -File instalar/verificar.ps1 | Select-Object -Last 1
          Write-Output "verificar => $v"
          if ($v -notlike '*"ok":true*') { $falhas += 'verificar' }
          $r = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $inst passo node --agente codex | Select-Object -Last 1
          Write-Output "passo node de novo => $r"
          if ($r -notlike '*JA_PRONTO*') { $falhas += 'ja-pronto' }

          # 3. Um site de exemplo de ponta a ponta, pelo estudio.
          foreach ($c in @('versao', 'verificar', 'espelhar --conferir', 'novo exemplo', 'montar exemplo', 'prints exemplo', 'desempenho exemplo', 'pacote exemplo')) {
            $r = cmd.exe /d /c ".\estudio.cmd $c" | Select-Object -Last 1
            Write-Output "estudio $c => $r"
            if ($r -notlike '*"ok":true*') { $falhas += ('estudio ' + $c) }
          }
          # O molde e de um negocio ficticio: o preflight precisa reprovar ate o texto do molde sair.
          $r = cmd.exe /d /c ".\estudio.cmd preflight exemplo" | Select-Object -Last 1
          Write-Output "estudio preflight exemplo (molde) => $r"
          if ($r -notlike '*"codigo":"PREFLIGHT_REPROVADO"*' -or $r -notlike '*resto-do-molde*') { $falhas += 'estudio preflight-molde' }
          if ($r -like '*"etapa":"medir"*' -or $r -like '*"etapa":"acessibilidade"*') { $falhas += 'estudio preflight-medidas' }

          # 4. A pessoa fecha e cola o link de novo: baixa outra copia, e o estudio instalado continua.
          $denovo = Join-Path $dl 'de-novo'
          New-Item -ItemType Directory -Force $denovo | Out-Null
          tar.exe -xf $Z -C $denovo
          Set-Location (Join-Path $denovo 'site-estudio')
          $r = powershell.exe -NoProfile -ExecutionPolicy Bypass -File instalar/instalar.ps1 mudar-pasta --agente codex | Select-Object -Last 1
          Write-Output "mudar-pasta (colou de novo) => $r"
          if ($r -notlike '*"codigo":"PASTA_DESTINO_EXISTE"*') { $falhas += 'colar-de-novo' }
          Set-Location $casa
          $r = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $inst plano --agente codex | Select-Object -Last 1
          Write-Output "plano (depois de colar de novo) => $r"

          # 5. Atualizar: finge que o instalado e mais antigo e atualiza a partir do zip deste commit.
          # O zip de teste traz um estudio.cmd com uma linha a mais no topo: o atualizar reescreve o
          # .cmd que esta rodando, e a linha "... & exit /b" precisa sair sem ler o arquivo novo.
          $tz = Join-Path $env:RUNNER_TEMP 'zip-teste'
          New-Item -ItemType Directory -Force $tz | Out-Null
          tar.exe -xf $Z -C $tz
          $cmdTeste = Join-Path $tz 'site-estudio\estudio.cmd'
          $linhasCmd = [System.IO.File]::ReadAllLines($cmdTeste)
          $marca = 'rem teste da maquina limpa: este .cmd foi trocado enquanto rodava'
          $novoCmd = @($linhasCmd[0], $marca) + $linhasCmd[1..($linhasCmd.Length - 1)]
          [System.IO.File]::WriteAllText($cmdTeste, (($novoCmd -join "`r`n") + "`r`n"), (New-Object System.Text.ASCIIEncoding))
          $Z2 = Join-Path $env:RUNNER_TEMP 'site-estudio-teste.zip'
          Push-Location $tz
          tar.exe -a -cf $Z2 site-estudio
          Pop-Location
          (Get-FileHash -Algorithm SHA256 $Z2).Hash.ToLower() + '  site-estudio-teste.zip' | Set-Content -Encoding ascii ($Z2 + '.sha256')
          Set-Content -NoNewline -Encoding ascii (Join-Path $casa 'VERSAO') '0.0.1'
          # Uma skill posta pela pessoa precisa sobreviver a troca de .claude/skills.
          $minha = Join-Path $casa '.claude\skills\minha-skill'
          New-Item -ItemType Directory -Force $minha | Out-Null
          Set-Content -Encoding ascii (Join-Path $minha 'SKILL.md') 'minha'
          # Falha no meio da troca (README aberto com trava): tudo volta e nenhuma copia fica.
          $trava = [System.IO.File]::Open((Join-Path $casa 'README.md'), 'Open', 'Read', 'None')
          $r = cmd.exe /d /c ".\estudio.cmd atualizar --de ""$Z2""" | Select-Object -Last 1
          $trava.Close()
          Write-Output "atualizar (com README travado) => $r"
          if ($r -notlike '*ATUALIZACAO_FALHOU*') { $falhas += 'atualizar-falha' }
          if ((Get-Content -Raw (Join-Path $casa 'VERSAO')).Trim() -ne '0.0.1') { $falhas += 'atualizar-falha-versao' }
          if (@(Get-ChildItem (Join-Path $casa '.ferramentas') -Filter 'versao-anterior-*' -Directory -ErrorAction SilentlyContinue).Count -ne 0) { $falhas += 'atualizar-falha-copia' }
          if ((Get-Content -Raw (Join-Path $casa 'estudio.cmd')).Contains($marca)) { $falhas += 'atualizar-falha-trocou-cmd' }
          $r = cmd.exe /d /c ".\estudio.cmd atualizar --de ""$Z2""" | Select-Object -Last 1
          Write-Output "atualizar (de uma versao antiga, trocando o .cmd que roda) => $r"
          if ($r -notlike '*ESTUDIO_ATUALIZADO*') { $falhas += 'atualizar' }
          if (-not (Get-Content -Raw (Join-Path $casa 'estudio.cmd')).Contains($marca)) { $falhas += 'atualizar-cmd-novo' }
          if (-not (Test-Path (Join-Path $minha 'SKILL.md'))) { $falhas += 'atualizar-skill-da-pessoa' }
          $r = cmd.exe /d /c ".\estudio.cmd versao" | Select-Object -Last 1
          Write-Output "versao (com o .cmd novo) => $r"
          if ($r -notlike '*"ok":true*') { $falhas += 'versao-depois-de-atualizar' }
          $r = cmd.exe /d /c ".\estudio.cmd atualizar --de ""$Z2""" | Select-Object -Last 1
          Write-Output "atualizar (de novo) => $r"
          if ($r -notlike '*JA_ATUALIZADO*') { $falhas += 'ja-atualizado' }
          if (-not (Test-Path (Join-Path $casa 'sites\exemplo\site\index.html'))) { $falhas += 'atualizar-preservou' }

          # 6. Desinstalar sem confirmar so diz o que apagaria.
          $r = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $inst desinstalar | Select-Object -Last 1
          Write-Output "desinstalar (sem confirmar) => $r"
          if ($r -notlike '*"confirmado":false*') { $falhas += 'desinstalar' }

          if ($falhas.Count -gt 0) { Write-Output "FALHARAM: $($falhas -join ', ')"; exit 1 }
          Write-Output "TUDO OK"
      - name: Juntar logs
        if: always()
        shell: powershell
        run: |
          $l = Join-Path $env:USERPROFILE 'site-estudio\.ferramentas\logs'
          if (Test-Path $l) { Copy-Item -Recurse $l (Join-Path $env:GITHUB_WORKSPACE 'logs-estudio') }
      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: logs-estudio
          if-no-files-found: ignore

  mac:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: Mac Intel.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Jornada de quem usa (Terminal)
        # Sem -e: um passo que falha e anotado e o teste segue, para mostrar tudo de uma vez.
        shell: bash --noprofile --norc {0}
        run: |
          falhas=""
          Z="$RUNNER_TEMP/site-estudio.zip"
          # O zip do release tem uma pasta so, chamada site-estudio; este e igual, feito deste commit.
          git archive --format=zip --prefix=site-estudio/ -o "$Z" HEAD
          codigo="$(curl -sIL -o /dev/null -w '%{http_code}' "$LINK_DO_ESTUDIO")"
          echo "link publico responde => $codigo (informativo: so existe depois do primeiro release)"

          # 1. O assistente baixa e descompacta em Downloads, fora do lugar de sempre.
          mkdir -p "$HOME/Downloads"
          cd "$HOME/Downloads" && unzip -q "$Z"
          cd "$HOME/Downloads/site-estudio"
          r="$(bash instalar/instalar.sh mudar-pasta --agente codex | tail -1)"
          echo "mudar-pasta (de Downloads) => $r"
          case "$r" in *'"codigo":"INSTALADO"'*) ;; *) falhas="$falhas mudar-pasta" ;; esac
          [ -f "$HOME/site-estudio/AGENTS.md" ] || falhas="$falhas pasta-no-lugar"
          [ -e "$HOME/Downloads/site-estudio" ] && falhas="$falhas sobrou-em-downloads"

          # 2. Instala tudo a partir do lugar de sempre.
          cd "$HOME/site-estudio"
          echo "checar => $(bash instalar/instalar.sh checar --agente codex | tail -1)"
          for p in pasta node pacotes navegador; do
            ultima="$(bash instalar/instalar.sh passo "$p" --agente codex --modo tudo | tail -1)"
            echo "passo $p => $ultima"
            case "$ultima" in *'"ok":true'*) ;; *) falhas="$falhas $p" ;; esac
          done
          v="$(bash instalar/verificar.sh | tail -1)"
          echo "verificar => $v"
          case "$v" in *'"ok":true'*) ;; *) falhas="$falhas verificar" ;; esac
          r="$(bash instalar/instalar.sh passo node --agente codex | tail -1)"
          echo "passo node de novo => $r"
          case "$r" in *JA_PRONTO*) ;; *) falhas="$falhas ja-pronto" ;; esac

          # 3. Um site de exemplo de ponta a ponta, pelo estudio.
          for c in versao verificar "espelhar --conferir" "novo exemplo" "montar exemplo" "prints exemplo" "desempenho exemplo" "pacote exemplo"; do
            # shellcheck disable=SC2086 # o comando tem mais de uma palavra de proposito
            r="$(./estudio $c | tail -1)"
            echo "estudio $c => $r"
            case "$r" in *'"ok":true'*) ;; *) falhas="$falhas estudio-$c" ;; esac
          done
          # O molde e de um negocio ficticio: o preflight precisa reprovar ate o texto do molde sair.
          r="$(./estudio preflight exemplo | tail -1)"
          echo "estudio preflight exemplo (molde) => $r"
          case "$r" in *'"codigo":"PREFLIGHT_REPROVADO"'*resto-do-molde*) ;; *) falhas="$falhas estudio-preflight-molde" ;; esac
          case "$r" in *'"etapa":"medir"'*|*'"etapa":"acessibilidade"'*) falhas="$falhas estudio-preflight-medidas" ;; esac

          # 4. A pessoa fecha e cola o link de novo: baixa outra copia, e o estudio instalado continua.
          mkdir -p "$HOME/Downloads/de-novo" && cd "$HOME/Downloads/de-novo" && unzip -q "$Z"
          cd "$HOME/Downloads/de-novo/site-estudio"
          r="$(bash instalar/instalar.sh mudar-pasta --agente codex | tail -1)"
          echo "mudar-pasta (colou de novo) => $r"
          case "$r" in *'"codigo":"PASTA_DESTINO_EXISTE"'*) ;; *) falhas="$falhas colar-de-novo" ;; esac
          cd "$HOME/site-estudio"
          echo "plano (depois de colar de novo) => $(bash instalar/instalar.sh plano --agente codex | tail -1)"

          # 5. Atualizar: finge que o instalado e mais antigo e atualiza a partir do zip deste commit.
          # O zip de teste traz um estudio.cmd com uma linha a mais (igual ao teste do Windows).
          T="$RUNNER_TEMP/zip-teste"
          mkdir -p "$T" && (cd "$T" && unzip -q "$Z")
          marca='rem teste da maquina limpa: este .cmd foi trocado enquanto rodava'
          { head -n 1 "$T/site-estudio/estudio.cmd"; printf '%s\r\n' "$marca"; tail -n +2 "$T/site-estudio/estudio.cmd"; } > "$T/estudio.cmd.novo"
          mv "$T/estudio.cmd.novo" "$T/site-estudio/estudio.cmd"
          Z2="$RUNNER_TEMP/site-estudio-teste.zip"
          (cd "$T" && zip -qr "$Z2" site-estudio)
          (cd "$(dirname "$Z2")" && shasum -a 256 "$(basename "$Z2")" > "$Z2.sha256")
          printf '0.0.1\n' > VERSAO
          # Uma skill posta pela pessoa precisa sobreviver a troca de .claude/skills.
          mkdir -p .claude/skills/minha-skill && printf 'minha\n' > .claude/skills/minha-skill/SKILL.md
          # Falha no meio da troca (README travado): tudo volta e nenhuma copia fica.
          chflags uchg README.md
          r="$(./estudio atualizar --de "$Z2" | tail -1)"
          chflags nouchg README.md
          echo "atualizar (com README travado) => $r"
          case "$r" in *ATUALIZACAO_FALHOU*) ;; *) falhas="$falhas atualizar-falha" ;; esac
          [ "$(cat VERSAO)" = "0.0.1" ] || falhas="$falhas atualizar-falha-versao"
          for d in .ferramentas/versao-anterior-*; do [ -e "$d" ] && falhas="$falhas atualizar-falha-copia"; done
          r="$(./estudio atualizar --de "$Z2" | tail -1)"
          echo "atualizar (de uma versao antiga) => $r"
          case "$r" in *ESTUDIO_ATUALIZADO*) ;; *) falhas="$falhas atualizar" ;; esac
          grep -qF "$marca" estudio.cmd || falhas="$falhas atualizar-cmd-novo"
          [ -f .claude/skills/minha-skill/SKILL.md ] || falhas="$falhas atualizar-skill-da-pessoa"
          r="$(./estudio atualizar --de "$Z2" | tail -1)"
          echo "atualizar (de novo) => $r"
          case "$r" in *JA_ATUALIZADO*) ;; *) falhas="$falhas ja-atualizado" ;; esac
          [ -f sites/exemplo/site/index.html ] || falhas="$falhas atualizar-preservou"

          # 6. Desinstalar sem confirmar so diz o que apagaria.
          r="$(bash instalar/instalar.sh desinstalar | tail -1)"
          echo "desinstalar (sem confirmar) => $r"
          case "$r" in *'"confirmado":false'*) ;; *) falhas="$falhas desinstalar" ;; esac

          if [ -n "$falhas" ]; then echo "FALHARAM:$falhas"; exit 1; fi
          echo "TUDO OK"
      - name: Juntar logs
        if: always()
        run: |
          [ -d "$HOME/site-estudio/.ferramentas/logs" ] && cp -R "$HOME/site-estudio/.ferramentas/logs" "$GITHUB_WORKSPACE/logs-estudio" || true
      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: logs-estudio
          if-no-files-found: ignore
